<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · InvestAI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="login-title">
    <div class="auth-brand">📈 InvestAI</div>
    <h1 id="login-title">Sign in</h1>
    <p class="auth-subtitle">Private investment operations console</p>
    <form id="login-form" autocomplete="on">
      <label for="username">ID</label>
      <input id="username" name="username" autocomplete="username" required maxlength="128" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" />
      <button type="submit">Sign in</button>
      <p id="login-error" class="auth-error" role="alert" hidden></p>
    </form>
    <p class="auth-note">Access is restricted to your WireGuard VPN.</p>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('login-error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.hidden = true;
      const body = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      };
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin',
          body: JSON.stringify(body),
        });
        if (!response.ok) throw new Error(response.status === 429 ? 'Too many attempts. Try again later.' : 'Invalid ID or password.');
        window.location.assign('/');
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
